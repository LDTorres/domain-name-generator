services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    environment:
      DATABASE_URL: "file:/data/brandforge.db"
      DOMAIN_PROVIDER_ORDER: "${DOMAIN_PROVIDER_ORDER:-hostinger,cloudflare,porkbun,namecheap,rdap}"
      DOMAIN_CACHE_TTL_SECONDS: "${DOMAIN_CACHE_TTL_SECONDS:-86400}"
      DOMAIN_RATE_LIMIT_REQUESTS: "${DOMAIN_RATE_LIMIT_REQUESTS:-10}"
      DOMAIN_RATE_LIMIT_WINDOW_SECONDS: "${DOMAIN_RATE_LIMIT_WINDOW_SECONDS:-60}"
      HOSTINGER_API_TOKEN: "${HOSTINGER_API_TOKEN:-}"
      CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID:-}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
      PORKBUN_API_KEY: "${PORKBUN_API_KEY:-}"
      PORKBUN_SECRET_API_KEY: "${PORKBUN_SECRET_API_KEY:-}"
      NAMECHEAP_API_USER: "${NAMECHEAP_API_USER:-}"
      NAMECHEAP_API_KEY: "${NAMECHEAP_API_KEY:-}"
      NAMECHEAP_USERNAME: "${NAMECHEAP_USERNAME:-}"
      NAMECHEAP_CLIENT_IP: "${NAMECHEAP_CLIENT_IP:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-openrouter/free}"
      OPENROUTER_TIMEOUT_MS: "${OPENROUTER_TIMEOUT_MS:-20000}"
      OPENROUTER_APP_NAME: "${OPENROUTER_APP_NAME:-Brandforge}"
      OPENROUTER_LOG_PAYLOADS: "${OPENROUTER_LOG_PAYLOADS:-false}"
      AI_RATE_LIMIT_REQUESTS: "${AI_RATE_LIMIT_REQUESTS:-5}"
      AI_RATE_LIMIT_WINDOW_SECONDS: "${AI_RATE_LIMIT_WINDOW_SECONDS:-60}"
      APP_ACCESS_USERNAME: "${APP_ACCESS_USERNAME:-}"
      APP_ACCESS_PASSWORD: "${APP_ACCESS_PASSWORD:-}"
    volumes:
      - brandforge-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  brandforge-data:
