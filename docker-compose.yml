services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    environment:
      DATABASE_URL: "file:/data/brandforge.db"
      DOMAIN_PROVIDER: "${DOMAIN_PROVIDER:-rdap}"
      DOMAIN_CACHE_TTL_SECONDS: "${DOMAIN_CACHE_TTL_SECONDS:-86400}"
      DOMAIN_RATE_LIMIT_REQUESTS: "${DOMAIN_RATE_LIMIT_REQUESTS:-20}"
      DOMAIN_RATE_LIMIT_WINDOW_SECONDS: "${DOMAIN_RATE_LIMIT_WINDOW_SECONDS:-60}"
      NAMECHEAP_API_USER: "${NAMECHEAP_API_USER:-}"
      NAMECHEAP_API_KEY: "${NAMECHEAP_API_KEY:-}"
      NAMECHEAP_USERNAME: "${NAMECHEAP_USERNAME:-}"
      NAMECHEAP_CLIENT_IP: "${NAMECHEAP_CLIENT_IP:-}"
    volumes:
      - brandforge-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  brandforge-data:
